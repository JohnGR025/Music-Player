<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mini Player</title>
  <link rel="stylesheet" href="mini_style.css">
</head>
<body>
  <div class="MiniPlayer">
    <button id="opacityToggleBtn" class="mini-opacity-btn" title="Toggle window opacity" type="button" aria-label="Toggle window opacity" aria-pressed="false">
      <span class="icon-mask" style="--icon-url: url('build/icons/ui/opacity.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 12px; height: 12px;"></span>
    </button>
    <button id="closeMiniBtn" class="mini-close-btn" title="Close mini player" type="button" aria-label="Close mini player">
      <span class="icon-mask" style="--icon-url: url('build/icons/ui/close.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 12px; height: 12px;"></span>
    </button>

    <div id="miniTitle" class="mini-title">No track loaded</div>

    <div class="mini-seek-row">
      <input id="miniSeek" type="range" min="0" max="100" value="0" />
      <span id="miniTime">0:00 / 0:00</span>
    </div>

    <div class="mini-controls">
      <div id="controlBtns">
        <button id="miniPrevBtn" class="icon-btn" title="Previous" type="button" aria-label="Previous">
          <span class="icon-mask" style="--icon-url: url('build/icons/ui/previous.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 18px; height: 18px;"></span>
        </button>
        <button id="miniPlayPauseBtn" class="play-pause-btn" title="Play/Pause" type="button">
          <span class="icon-mask play-icon" style="--icon-url: url('build/icons/ui/play.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 20px; height: 20px;"></span>
          <span class="icon-mask pause-icon hidden" style="--icon-url: url('build/icons/ui/pause.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 20px; height: 20px;"></span>
        </button>
        <button id="miniNextBtn" class="icon-btn" title="Next" type="button" aria-label="Next">
          <span class="icon-mask" style="--icon-url: url('build/icons/ui/next.svg'); -webkit-mask-image: var(--icon-url); mask-image: var(--icon-url); width: 18px; height: 18px;"></span>
        </button>
      </div>
      <input id="miniVol" type="range" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <script src="mini_renderer.js"></script>
</body>
</html>
